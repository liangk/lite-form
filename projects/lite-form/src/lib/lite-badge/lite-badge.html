<div class="lite-badge" [ngClass]="[getVariantClass(), getSizeClass(), badge().removable ? 'badge-removable' : '']">
  @if (badge().icon) {
    <span class="badge-icon" [innerHTML]="badge().icon"></span>
  }
  <span class="badge-label">{{ badge().label }}</span>
  @if (badge().removable) {
    <button type="button" class="badge-remove" (click)="onRemove($event)" [attr.aria-label]="'Remove ' + badge().label">
      <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  }
</div>
