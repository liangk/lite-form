name: Publish NPM Package to GitHub Packages

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        registry-url: 'https://registry.npmjs.org'
        always-auth: true
        
    - name: Cache node modules
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-node-
          
    - name: Install dependencies
      run: npm ci
      
    - name: Build library
      run: npm run build:lib

    - name: Copy license into package
      run: |
        cp LICENSE dist/lite-form/LICENSE

    - name: Sync package version from source
      run: |
        SOURCE_VERSION=$(node -p "require('./projects/lite-form/package.json').version")
        echo "SOURCE_VERSION=$SOURCE_VERSION" >> $GITHUB_ENV
        cd dist/lite-form
        node -e "const fs=require('fs'); const path=require('path'); const version=process.argv[1]; if(!version){throw new Error('Missing version argument');} const pkgPath=path.resolve('package.json'); const pkg=JSON.parse(fs.readFileSync(pkgPath,'utf8')); if(pkg.version!==version){pkg.version=version;} fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2)+'\n');" "$SOURCE_VERSION"

    - name: Publish to npmjs (public)
      if: github.ref == 'refs/heads/main'
      run: |
        cd dist/lite-form
        npm publish --access public --registry=https://registry.npmjs.org/ --loglevel verbose
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        
    - name: Create release tag (main branch only)
      if: github.ref == 'refs/heads/main'
      run: |
        cd dist/lite-form
        VERSION=$(node -p "require('./package.json').version")
        cd ../../
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git tag -a "v$VERSION" -m "Release version $VERSION"
        git push origin "v$VERSION"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Comment with package info
      if: github.ref == 'refs/heads/main'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('dist/lite-form/package.json', 'utf8'));
          const packageName = packageJson.name;
          const packageVersion = packageJson.version;
          
          await github.rest.issues.createComment({
            issue_number: context.payload.number || context.runId,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **NPM Package Published Successfully!**\n\n` +
                  `📦 **Package:** \`${packageName}\`\n` +
                  `🏷️ **Version:** \`${packageVersion}\`\n` +
                  `📥 **Installation:**\n\`\`\`bash\nnpm install ${packageName}@${packageVersion}\n\`\`\`\n\n` +
                  `🔗 **Registry:** [npm Registry](https://www.npmjs.com/package/${packageName})`
          });
