name: Lint and Test

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project: [lite-form, ui-sandbox]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Lint ${{ matrix.project }}
      run: npx ng lint ${{ matrix.project }}
      
    - name: Test ${{ matrix.project }}
      run: npx ng test ${{ matrix.project }} --watch=false --browsers=ChromeHeadless
